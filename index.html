<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寿司ドラゴン - Authentic Nippon Sushi Bar</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/examples/jsm/" } }
</script>
<style>
  @font-face { font-family: 'DotGothic16'; src: url('fonts/DotGothic16-Regular.ttf'); font-display: block; }
  :root { --px: 4px; }
  html, body { margin: 0; height: 100%; background: #120a0c; overflow: hidden; font-family: 'DotGothic16', 'Hiragino Kaku Gothic ProN', monospace; }
  :root { --logw: 0px; }
  #stage canvas { position: fixed; left: 0; top: 0; display: block; }
  #bubbles { position: fixed; inset: 0 var(--logw) 0 0; pointer-events: none; overflow: hidden; }

  /* ドット絵風の吹き出し: 4隅が欠けた四角 */
  .bubble {
    position: absolute; left: 0; top: 0; will-change: transform;
    background: #fff; color: #161016; margin: 4px;
    padding: 6px 10px 7px; line-height: 1.3; letter-spacing: .02em;
    font-size: clamp(11px, 1.35vw, 19px);
    max-width: min(14em, 24vw); overflow-wrap: anywhere; text-align: left;
    box-shadow: -4px 0 0 0 #161016, 4px 0 0 0 #161016, 0 -4px 0 0 #161016, 0 4px 0 0 #161016,
                inset -4px -4px 0 0 rgba(0,0,0,.10);
    transition: opacity .25s; opacity: 1;
  }
  .bubble.out { opacity: 0; }
  .bubble::after {
    content: '▼'; position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px);
    font-size: .8em; line-height: 1; color: #161016; text-shadow: 0 -2px 0 #fff;
  }
  .bubble .who {
    display: block; font-size: .72em; margin: -2px 0 3px; color: #888; letter-spacing: .08em;
  }
  .bubble.chef  { background: #ffe58a; box-shadow: -4px 0 0 0 #5a3a10, 4px 0 0 0 #5a3a10, 0 -4px 0 0 #5a3a10, 0 4px 0 0 #5a3a10, inset -4px -4px 0 0 rgba(0,0,0,.12); }
  .bubble.chef .who { color: #a5761c; }
  .bubble.chef::after { color: #5a3a10; text-shadow: 0 -2px 0 #ffe58a; }
  .bubble.staff { background: #ffd2e6; box-shadow: -4px 0 0 0 #6a1e42, 4px 0 0 0 #6a1e42, 0 -4px 0 0 #6a1e42, 0 4px 0 0 #6a1e42, inset -4px -4px 0 0 rgba(0,0,0,.10); }
  .bubble.staff .who { color: #c03a80; }
  .bubble.staff::after { color: #6a1e42; text-shadow: 0 -2px 0 #ffd2e6; }
  .bubble.ninja { background: #262633; color: #e8e8f4; box-shadow: -4px 0 0 0 #9a9ab8, 4px 0 0 0 #9a9ab8, 0 -4px 0 0 #9a9ab8, 0 4px 0 0 #9a9ab8; }
  .bubble.ninja .who { color: #9a9ab8; }
  .bubble.ninja::after { color: #9a9ab8; text-shadow: 0 -2px 0 #262633; }
  .bubble.shout { color: #d81e1e; font-size: clamp(14px, 1.9vw, 26px); animation: shake .09s steps(2) infinite; }
  .bubble.money { background: #1d2a18; color: #b8ff7a; box-shadow: -4px 0 0 0 #b8ff7a, 4px 0 0 0 #b8ff7a, 0 -4px 0 0 #b8ff7a, 0 4px 0 0 #b8ff7a; }
  .bubble.money::after { display: none; }
  @keyframes shake { 0% { margin-left: 2px; } 100% { margin-left: 6px; } }

  #crt { position: fixed; inset: 0 var(--logw) 0 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 55%, rgba(20,0,20,.4) 100%); }
  #hud {
    position: fixed; left: 14px; bottom: 12px; color: #fff; pointer-events: none;
    background: rgba(14, 8, 10, .72); padding: 8px 14px 10px;
    box-shadow: -4px 0 0 0 #2bf0ff, 4px 0 0 0 #2bf0ff, 0 -4px 0 0 #2bf0ff, 0 4px 0 0 #2bf0ff, 0 0 18px 4px rgba(43,240,255,.55);
    margin: 4px;
  }
  #hud .title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 900; font-size: clamp(18px, 2.4vw, 32px); color: #ffe14a; letter-spacing: .12em; text-shadow: 0 0 6px #ff2bd6, 0 0 16px #ff2bd6; }
  #hud .sub { font-size: clamp(9px, 1vw, 13px); color: #ff8adf; text-shadow: 0 0 6px #ff2bd6; margin-top: 2px; }
  #hud .row { font-size: clamp(11px, 1.2vw, 16px); margin-top: 6px; color: #7afcff; text-shadow: 0 0 6px #2bf0ff; }
  #flash-layer { position: fixed; inset: 0 var(--logw) 0 0; pointer-events: none; overflow: hidden; }
  .flash { position: absolute; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 65%); animation: fl .28s steps(4) forwards; }
  @keyframes fl { to { opacity: 0; transform: scale(1.4); } }
  /* 右側のライブログ */
  #log {
    position: fixed; right: 0; top: 0; bottom: 0; width: var(--logw); display: none; flex-direction: column;
    background: rgba(10, 4, 22, .94); color: #e8e4f4; border-left: 4px solid #2bf0ff;
    box-shadow: -6px 0 22px rgba(43, 240, 255, .35); box-sizing: border-box;
  }
  #log.on { display: flex; }
  #log .head {
    padding: 10px 12px 8px; font-size: clamp(13px, 1.15vw, 17px); color: #ffe14a; letter-spacing: .12em;
    text-shadow: 0 0 6px #ff2bd6; border-bottom: 2px dashed #3a2a6a; display: flex; justify-content: space-between; align-items: baseline;
  }
  #log .head small { font-size: .65em; color: #7afcff; text-shadow: none; letter-spacing: 0; }
  #logbody { flex: 1; overflow-y: auto; padding: 8px 10px 14px; scrollbar-width: none; }
  #logbody::-webkit-scrollbar { display: none; }
  .ent { font-size: clamp(11px, .95vw, 14px); line-height: 1.45; margin: 0 0 6px; padding: 3px 0 4px 6px; border-left: 3px solid #4a3a7a; animation: ent .35s steps(4); overflow-wrap: anywhere; }
  @keyframes ent { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  .ent .t { color: #6a6a9a; margin-right: 6px; font-size: .85em; }
  .ent .tag { display: inline-block; padding: 0 5px; margin-right: 6px; font-size: .85em; color: #10081e; background: #9a9ab8; }
  .ent .who { margin-right: 4px; }
  .ent.visit { border-color: #2bf0ff; } .ent.visit .tag { background: #2bf0ff; }
  .ent.order { border-color: #ffe14a; } .ent.order .tag { background: #ffe14a; }
  .ent.make  { border-color: #ff9a3c; } .ent.make .tag { background: #ff9a3c; }
  .ent.serve { border-color: #ff2bd6; } .ent.serve .tag { background: #ff2bd6; }
  .ent.money { border-color: #7aff4a; color: #b8ff7a; } .ent.money .tag { background: #7aff4a; }
  .ent.leave { border-color: #8a5cff; } .ent.leave .tag { background: #8a5cff; }
  .ent.tea, .ent.clean { border-color: #5a8a6a; } .ent.tea .tag, .ent.clean .tag { background: #5ad0a0; }
  .ent.say.chef .who { color: #ffe58a; } .ent.say.staff .who { color: #ff9ad2; }
  .ent.say.ninja .who { color: #9ab0ff; } .ent.say.guest .who { color: #7afcff; }
  #logkey { position: fixed; right: 8px; bottom: 6px; font-size: 11px; color: #6a6a9a; pointer-events: none; z-index: 5; }
  #err { position: fixed; left: 0; right: 0; bottom: 0; background: #900; color: #fff; font: 12px monospace; padding: 6px 10px; display: none; white-space: pre-wrap; z-index: 99; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="crt"></div>
<div id="bubbles"></div>
<div id="flash-layer"></div>
<div id="hud">
  <div class="title">寿司ドラゴン</div>
  <div class="sub">~ Authentic Nippon Sushi Bar ~</div>
  <div class="row">SALES $<span id="sales">0.00</span> ／ GUESTS <span id="guests">0</span></div>
</div>
<div id="log"><div class="head"><span>LIVE LOG</span><small>[L] とじる</small></div><div id="logbody"></div></div>
<div id="err"></div>
<script>
  window.__showError = (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += String(e && e.stack || e) + '\n'; };
  window.addEventListener('error', (ev) => window.__showError(ev.error || ev.message));
  window.addEventListener('unhandledrejection', (ev) => window.__showError(ev.reason));
</script>
<script type="module" src="main.js"></script>
</body>
</html>
